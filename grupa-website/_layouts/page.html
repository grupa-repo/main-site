---
layout: default
---
<section style="padding: 10rem 0 6rem; min-height: 70vh;">
  <div class="container">
    <h1 style="font-family: var(--font-display); font-size: clamp(2.2rem, 4vw, 3.2rem); font-weight: 800; color: var(--white); letter-spacing: -0.025em; margin-bottom: 2.5rem;">{{ page.title }}</h1>
    <div style="max-width: 760px; color: var(--text); line-height: 1.8; font-size: 1.05rem;">
      {{ content }}
    </div>
  </div>
</section>
